name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release APKs
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_NAME: ${{ github.ref_type == 'tag' && github.ref_name || '0.0.0-manual' }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          export VERSION_NAME="${VERSION_NAME#v}"
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Rename APKs
        run: |
          TAG="${{ github.ref_type == 'tag' && github.ref_name || 'manual' }}"
          cd app/build/outputs/apk/release
          ls -l
          mkdir -p "$GITHUB_WORKSPACE/dist"
          for abi in arm64-v8a universal; do
            f=$(ls *-"$abi"-release.apk | head -n1)
            cp "$f" "$GITHUB_WORKSPACE/dist/fitlife-hub-$TAG-$abi.apk"
          done

      - uses: softprops/action-gh-release@v2
        if: github.ref_type == 'tag'
        with:
          files: dist/*.apk
          generate_release_notes: true

      - uses: actions/upload-artifact@v4
        if: github.ref_type != 'tag'
        with:
          name: apks
          path: dist/*.apk
