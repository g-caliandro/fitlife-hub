[versions]
agp = "8.7.3"
kotlin = "2.1.0"
ksp = "2.1.0-1.0.29"
composeBom = "2024.12.01"
room = "2.6.1"
navigation = "2.8.5"
work = "2.10.0"
serialization = "1.7.3"
